# The herdr BOX — the image composing the herdr + socat + supervisord candies
# onto the upstream fedora:43 base. Build: `charly box build herdr`.
# Deploy: `charly config herdr` / compose `herdr` into any app. The bed
# (check-herdr-pod) deploys this image and probes it through the herdr plugin's
# two surfaces (`herdr:` verb over the reverse channel + `charly herdr` CLI).
herdr:
    candy:
        base: quay.io/fedora/fedora:43
        distro:
            - fedora:43
            - fedora
        candy:
            - '@github.com/opencharly/layer-supervisord:v2026.240.0121'
            - '@github.com/opencharly/layer-socat:v2026.235.2057'
            - '@github.com/opencharly/plugin-herdr/candy/plugin-herdr:v2026.245.1008'
            - herdr
        description: |-
            The herdr terminal-multiplexer server BOX (fedora:43 base): the
            pinned herdr release binary with a supervised headless server and a
            TCP socket bridge on port 8095. Compose this box anywhere a herdr
            session should live; host-side `herdr:` check verbs and
            `charly herdr --endpoint tcp://host:8095` probe the venue's NDJSON
            socket through the bridge.
        plan:
            - # ADE: the composed image ships the herdr runtime (deterministic
              # build-context checks; the live service/bridge/verb surfaces are the
              # check-herdr-pod bed's job).
              check: the herdr binary is installed in the composed image
              file:
                file: /usr/local/bin/herdr
                exists: true
                filetype: file
            - check: the herdr server + bridge start scripts are installed
              file:
                file: /opt/herdr/start-bridge.sh
                exists: true
                filetype: file
            - check: herdr --version reports the pinned v0.8.2
              command:
                command: herdr --version
              stdout:
                contains: "0.8.2"
